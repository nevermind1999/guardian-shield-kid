apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Commit em que este APK foi compilado — o painel compara com o último commit da main no
// GitHub pra avisar que tem versão nova (ver util/AppUpdater.kt).
def gitSha = { ->
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
            standardOutput = out
            ignoreExitValue = true
        }
        def sha = out.toString().trim()
        return sha ? sha : 'dev'
    } catch (Exception e) {
        return 'dev'
    }
}()

android {
    namespace "com.guardianshield.child"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.guardianshield.child"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0"
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
}
